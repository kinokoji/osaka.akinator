function renderFeedbackResult(record,saved){
  const mismatches=record.answers.filter(a=>a.mismatch);

  const rowsHtml=record.answers.map((a,i)=>{

 '棚田米':['千早赤阪村'],
 'つまようじ':['河内長野市']
};
questionDefs.splice(0,questionDefs.length,...questionDefs.filter(q=>q[0]!=='食べ物・名産が有名？（地名を含む名称以外）'));
Object.entries(localFoodAreas).forEach(([food,names])=>questionDefs.push([`この地域の名物に「${food}」がある？`,x=>names.includes(x.name)||(names.includes('大阪市')&&x.region==='大阪市')||(names.includes('堺市')&&x.region==='堺市')]));
// 名産の範囲を個別品目だけでなく、広いジャンルでも判定する。
// 複数の品目・ジャンルが同じ地域に該当するときは、そのどれか／両方という質問も出題する。
const foodGenrePatterns={
 '野菜・伝統野菜':/胡瓜|越瓜|南瓜|しろな|天満菜|人参|慈姑|茄子|なす|大根|れんこん|ごぼう|独活|真菜|ふき|きゃべつ|たまねぎ|さといも|えだまめ|たけのこ|野菜|農産物/,
 '果物・果樹':/ぶどう|葡萄|みかん|いちじく|もも|桃|栗|果物|果樹/,
 '魚介・海産物':/しらす|牡蠣|海産物|魚介|海鮮/,
 '郷土料理・ご当地グルメ':/たこ焼き|お好み焼き|うどんギョーザ|天ぷら|串カツ|沖縄料理|韓国料理|グルメ|飲食店|きつねうどん/,
 '菓子・加工食品':/和菓子|チキンラーメン|凍豆腐|ワイン|天ぷら|お好み焼き|たこ焼き/,
 '工芸・地場産業':/刃物|毛布|タオル|つまようじ|繊維|ものづくり|地場産品|地元農産物/,
 '米・穀物':/棚田米|米|農産物/,
 '農産物全般':/野菜|農産物|胡瓜|越瓜|南瓜|しろな|天満菜|人参|慈姑|茄子|なす|大根|れんこん|ごぼう|独活|真菜|ふき|きゃべつ|たまねぎ|さといも|えだまめ|たけのこ|ぶどう|葡萄|みかん|いちじく|もも|桃|栗|果物|果樹|棚田米|米/
};
function foodAreaMatches(x,names){return names.includes(x.name)||(names.includes('大阪市')&&x.region==='大阪市')||(names.includes('堺市')&&x.region==='堺市');}
function hasFoodGenre(x,genre){
 const pattern=foodGenrePatterns[genre];if(!pattern)return false;
 return Object.entries(localFoodAreas).some(([food,names])=>pattern.test(food)&&foodAreaMatches(x,names));
}
Object.keys(foodGenrePatterns).forEach(genre=>questionDefs.push([`名産に「${genre}」がある？`,x=>hasFoodGenre(x,genre)]));
questionDefs.push(
 ['名産に野菜・果物のどちらかがある？',x=>hasFoodGenre(x,'野菜・伝統野菜')||hasFoodGenre(x,'果物・果樹')],
 ['名産に農産物系と郷土料理・加工食品系の両方がある？',x=>(hasFoodGenre(x,'農産物全般')||hasFoodGenre(x,'果物・果樹'))&&(hasFoodGenre(x,'郷土料理・ご当地グルメ')||hasFoodGenre(x,'菓子・加工食品'))],
 ['名産に農産物系か工芸・地場産業系のどちらかがある？',x=>hasFoodGenre(x,'農産物全般')||hasFoodGenre(x,'工芸・地場産業')],
 ['名産に魚介・海産物と農産物の両方がある？',x=>hasFoodGenre(x,'魚介・海産物')&&hasFoodGenre(x,'農産物全般')]
);
// 同じ質問文が重複しないように最初の1件だけ残す。
const seenQuestionText=new Set();
questionDefs.splice(0,questionDefs.length,...questionDefs.filter(q=>{if(seenQuestionText.has(q[0]))return false;seenQuestionText.add(q[0]);return true;}));
// 回答ミスや未登録データがあっても正解候補を永久に消さない、重み付き推理方式。
// 一致する特徴を重視する一方、2〜3問の誤回答があっても全自治体を再評価する。
function displayName(name){
 const aliases={
  '北区（大阪市）':'大阪市北区','中央区（大阪市）':'大阪市中央区','西区（大阪市）':'大阪市西区',
  '港区（大阪市）':'大阪市港区','旭区（大阪市）':'大阪市旭区','鶴見区（大阪市）':'大阪市鶴見区',
  '北区（堺市）':'堺市北区','中区（堺市）':'堺市中区','東区（堺市）':'堺市東区',
  '西区（堺市）':'堺市西区','南区（堺市）':'堺市南区'
 };
 return aliases[name]||name;
}
function mismatchCount(x){
 let n=0;
 for(const a of answers){
  if(a.a==='maybe')continue;
  const q=questionDefs[a.i];
  if(!q)continue;
  const value=safeQuestionValue(q,x);
  if(value!==null&&value!==(a.a==='yes'))n++;
 }
 return n;
}
function candidateWeight(x){
 // 1つの矛盾で候補から消さず、少しずつ重みを下げる。
 return Math.pow(0.68,mismatchCount(x));
}
function plausibleCandidates(){
 const ranked=[...rows].filter(x=>!rejectedGuesses.has(x.name)).sort((a,b)=>candidateWeight(b)-candidateWeight(a)||mismatchCount(a)-mismatchCount(b));
 if(!ranked.length)return [];
 const best=mismatchCount(ranked[0]);
 // 候補を早めにしぼる。登録データの誤差に備えて、不一致は最大1問ぶんだけ許容する。
 const plausible=ranked.filter(x=>mismatchCount(x)<=best+1);
 return plausible.length?plausible:ranked.slice(0,4);
}
function isNameConfirmationQuestion(text){
 return /からはじまる？|名前に「.*」が含まれる|名前に「.*」が入ってる？/.test(text);
}
function chooseQuestion(allowRepeat=false){
 let best=null,bestScore=-1;
 const answeredCount=answers.filter(a=>a.a!=='maybe').length;
 const plausible=plausibleCandidates();
 const nameQuestionsAsked=answers.filter(a=>isNameConfirmationQuestion(questionDefs[a.i]?.[0]||'')).length;
 // 有力候補が4件以下なら、最後は名前系を最大2問だけ使って決める。
 // 名前での決め打ちは、少なくとも5問ほど地域特徴を聞いてから開始する。
 // これにより従来より平均2〜3問ぶん、地理・交通などの確認を増やして精度を上げる。
 const finalNamePhase=!continueAfterWrong&&(nameQuestionsAsked>0||(plausible.length<=4&&answers.length>=5));
 if(finalNamePhase&&nameQuestionsAsked>=2)return null;
 for(let i=0;i<questionDefs.length;i++){
  if(asked.has(i))continue;
  if(!allowRepeat&&answers.some(a=>a.i===i))continue;
  const q=questionDefs[i];
  const text=q[0];
  const specialtyPattern=/名産|名物|農産物|野菜|果物|魚介|海産物|郷土料理|ご当地グルメ|加工食品|工芸|地場産業|食べ物/;
  const specialtyAsked=answers.filter(a=>specialtyPattern.test(questionDefs[a.i]?.[0]||'')).length;
  // 名産系は最大3問まで。候補を減らす主役にはしない。
  if(specialtyPattern.test(text)&&specialtyAsked>=3)continue;
  const isNameConfirmation=isNameConfirmationQuestion(text);
  if(finalNamePhase&&!isNameConfirmation)continue;
  // 候補が4件より多い間は、文字・読みの質問を封印して地域特徴で絞る。
  if(!finalNamePhase&&isNameConfirmation)continue;
  const activeRows=plausible.length?plausible:rows.filter(x=>!rejectedGuesses.has(x.name));
  let yes=0,no=0,known=0;
  for(const x of activeRows){
   const v=safeQuestionValue(q,x);
   if(v===null)continue;
   const w=candidateWeight(x);
   known+=w;
   if(v)yes+=w;else no+=w;
  }
  if(!yes||!no||!known)continue;
  const balance=1-Math.abs(yes-no)/known;
  const coverage=known/Math.max(1,activeRows.reduce((sum,x)=>sum+candidateWeight(x),0));
  let score=balance*coverage;
  if(/鉄道|路線|「.*」が通っている|ニュートラム|阪急|阪神|南海|近鉄|京阪|JR|地下鉄|モノレール/.test(text))score+=0.12;
  if(specialtyPattern.test(text))score-=0.08;
  if(isNameConfirmation)score+=0.15;
  if(/鉄道路線は3本以上/.test(text))score-=0.05;
  if(/一級河川/.test(text))score-=0.18;
  if(answeredCount>0&&/一級河川/.test(questionDefs[answers[answers.length-1]?.i]?.[0]||''))score-=0.12;
  // 道路・高速道路の質問は補助情報扱いにし、頻度を抑える。
  const isRoadQuestion = roadNames.some(road=>text===`「${road}」が通っている？`) || /高速道路JCT|サービスエリア・パーキングエリア/.test(text);
  if(isRoadQuestion) {
    score -= 0.38;
    const recentRoads = answers.slice(-3).filter(a=>{
      const oldText=questionDefs[a.i]?.[0]||'';
      return roadNames.some(road=>oldText===`「${road}」が通っている？`) || /高速道路JCT|サービスエリア・パーキングエリア/.test(oldText);
    }).length;
    if(recentRoads>=1)score-=0.22;
    if(recentRoads>=2)score-=0.35;
  }
  if(/「(JR|阪急|阪神|京阪|近鉄|南海|大阪メトロ|大阪モノレール|北大阪急行|泉北高速鉄道|水間鉄道|阪堺電車|ニュートラム).*」が通っている？/.test(text))score+=0.08;
  if(answeredCount>=9&&score<0.04)continue;
  if(score>bestScore){bestScore=score;best={i,q};}
 }
 return best;
}
// 過去の候補リストで正解を永久除外しない。毎回74自治体すべてを再採点する。
function answer(i,a){
 asked.add(i);
 // 同じ質問を再確認した場合は、古い回答を残さず最新の回答で置き換える。
 answers=answers.filter(old=>old.i!==i);
 answers.push({i,a,prev:[...candidates]});
 candidates=[...rows];
 render();
}
function renderGuess(){
 const sorted=[...rows].filter(x=>!rejectedGuesses.has(x.name)).sort((a,b)=>candidateWeight(b)-candidateWeight(a)||mismatchCount(a)-mismatchCount(b));
 const first=sorted[0];
 currentGuessName=first?.name||'';
 const plausible=plausibleCandidates();
 const shown=sorted.slice(0,20);
 game.innerHTML=`<div class="result-kicker">MY GUESS</div><h2>もしかして……</h2><div class="result-name">${first?displayName(first.name):'うーん、迷った！'}</div><p class="result-sub">${first?(first.type==='区'?first.region+'の区':first.region+'エリアの'+first.type):'回答をもう一度見直してみてな。'}${first&&mismatchCount(first)>0?'（登録データと食い違う回答があるけど、誤回答の可能性も含めて推理してるで）':''}</p><div class="pills"><span class="pill">有力候補 ${plausible.length} 件</span><span class="pill">質問 ${answers.length} 回</span><span class="pill">最有力の不一致 ${first?mismatchCount(first):0} 件</span></div><div class="result-actions"><button class="answer primary" id="correct">正解！🎉</button><button class="answer" id="wrong">ちゃうで！</button></div><div class="list-wrap"><details><summary>有力候補を見る（上位20件）</summary><div class="candidates">${shown.map(x=>`<span class="candidate">${escapeHtml(displayName(x.name))}（不一致${mismatchCount(x)}）</span>`).join('')}</div></details></div><div class="controls"><button class="textbtn" id="undo">← ひとつ戻る</button><button class="textbtn" id="restart">もう一回遊ぶ ↻</button><button class="textbtn" id="feedback-archive">改善メモ・集計</button><button class="textbtn" id="tell-answer">正解を教えて記録</button></div>`;
 document.getElementById('correct').onclick=()=>{game.innerHTML=`<div class="result-kicker">NICE GUESS!</div><div class="result-name">当たった！🎉</div><p class="result-sub">大阪の地元力、なかなかやな。${escapeHtml(displayName(first?.name||''))}で正解！</p><button class="answer primary wide" id="again">もう一回遊ぶ ↻</button>`;document.getElementById('again').onclick=restart};
 document.getElementById('wrong').onclick=()=>handleWrongGuess(first);
 document.getElementById('undo').onclick=undo;
 document.getElementById('restart').onclick=restart;
 document.getElementById('feedback-archive').onclick=renderFeedbackArchive;
 document.getElementById('tell-answer').onclick=renderCorrection;
}
function handleWrongGuess(first){
 if(first)rejectedGuesses.add(first.name);
 wrongGuessCount++;
 if(wrongGuessCount>=3){
  game.innerHTML=`<div class="result-kicker">GIVE UP…</div><h2>ごめん！わからん！教えて！</h2><p class="hint">3回予想したけど、当てられへんかった……。正解を教えてくれたら、今回の回答を記録して次に活かすで。</p><div class="pills"><span class="pill">不正解 ${wrongGuessCount} 回</span><span class="pill">質問 ${answers.length} 回</span></div><div class="result-actions"><button class="answer primary wide" id="teach-answer">正解を教える！</button></div><div class="controls"><button class="textbtn" id="restart">もう一回遊ぶ ↻</button></div>`;
  document.getElementById('teach-answer').onclick=renderCorrection;
  document.getElementById('restart').onclick=restart;
  return;
 }
 game.innerHTML=`<div class="result-kicker">NOT QUITE</div><h2>あれ、違ったか！</h2><p class="hint">まだ諦めへんで。これまでの質問と回答はそのまま残して、まだ聞いていない地域の特徴を新しく質問して、さらに絞り込むで。</p><div class="pills"><span class="pill">不正解 ${wrongGuessCount}/3 回</span><span class="pill">質問 ${answers.length} 回</span></div><div class="result-actions"><button class="answer primary wide" id="continue-game">続きから遊ぶ</button></div><div class="controls"><button class="textbtn" id="restart">最初からやり直す ↻</button></div>`;
 document.getElementById('continue-game').onclick=()=>{continueAfterWrong=true;continuationQuestionStart=answers.length;render()};
 document.getElementById('restart').onclick=restart;
}
function restart(){candidates=[...rows];answers=[];asked=new Set();rejectedGuesses=new Set();currentGuessName='';wrongGuessCount=0;continueAfterWrong=false;continuationQuestionStart=0;render()}
document.title='大阪どこやねん？｜市区町村アキネイター';
try{
  render();
}catch(error){
  game.innerHTML='<div class="result-kicker">ERROR RECOVERY</div><h2>ゲームの読み込みに失敗したで</h2><p class="result-sub">プレビュー内で処理が止まったみたいや。いったん最初からやり直してみてな。</p><button class="answer primary wide" id="recovery-restart">再読み込み</button>';
  const recoveryButton=document.getElementById('recovery-restart');
  if(recoveryButton) recoveryButton.onclick=()=>location.reload();
  console.error('大阪どこやねん preview error:',error);
}
